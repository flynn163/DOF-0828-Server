
name: Sync Upstream

on:
  schedule:
    # 每天 UTC 时间 03:20 执行
    - cron: "0 16,22,4,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/2290193282/DOF-TAIWAN-SERVER.git
          git fetch upstream

      - name: Sync upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout main
          git merge upstream/main
          git push origin main
